<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Arreglos | JS</title>
    <link rel="stylesheet" href="css/ejercicio14.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Estadísticas de Números</h1>
        <p class="subtitulo">Ingresa una serie de números separados por comas para calcular sus propiedades.</p>

        <form class="formulario" id="formulario-numeros">
            <div class="grupo-formulario">
                <label for="entrada-numeros">Ingresa los números</label>
                <input type="text" id="entrada-numeros" placeholder="Ej: 10, 20, 30, 40, 50" required>
                <span class="error-mensaje" id="error-validacion"></span>
            </div>

            <button type="button" class="boton-enviar" id="btn-calcular">
                Calcular propiedades <span>→</span>
            </button>

            <hr class="separador">

            <div class="grupo-formulario">
                <label for="resultado-mayor">Número mayor</label>
                <input type="text" id="resultado-mayor" readonly placeholder="El mayor aparecerá aquí">
            </div>

            <div class="grupo-doble">
                <div class="grupo-formulario">
                    <label for="resultado-menor">Número menor</label>
                    <input type="text" id="resultado-menor" readonly placeholder="El menor aquí">
                </div>

                <div class="grupo-formulario">
                    <label for="resultado-promedio">Promedio total</label>
                    <input type="text" id="resultado-promedio" readonly placeholder="El promedio aquí">
                </div>
            </div>
        </form>
    </div>

    <script src="js/ejercicio14.js"></script>
</body>
</html>
