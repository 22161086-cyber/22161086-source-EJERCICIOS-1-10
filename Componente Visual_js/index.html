<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Reutilizable JS</title>
    <link rel="stylesheet" href="css/componente.css">
</head>
<body>

    <div class="main-card">
        <h1>Modal Reutilizable JS</h1>
        <p class="subtitle">
            Este componente permite mostrar ventanas emergentes personalizadas usando JavaScript, HTML y CSS.
        </p>
        
        <div class="button-group">
            <button class="btn btn-primary" onclick="mostrarModal('Información', 'Este es un modal informativo reutilizable.', 'Entendido')">
                Abrir modal informativo
            </button>
            <button class="btn btn-primary" onclick="mostrarModal('Advertencia', 'Debes revisar los datos antes de continuar.', 'Revisar')">
                Abrir modal de advertencia
            </button>
            <button class="btn btn-primary" onclick="mostrarModal('Éxito', 'La operación se realizó correctamente.', 'Aceptar')">
                Abrir modal de éxito
            </button>
        </div>
    </div>

    <!-- LÓGICA DIRECTA PARA EVITAR ERRORES DE RUTA -->
    <script>
    function mostrarModal(titulo, mensaje, textoBoton = 'Entendido') {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';

        overlay.innerHTML = `
            <div class="modal-box">
                <h2>${titulo}</h2>
                <p>${mensaje}</p>
                <button class="btn-modal-close">${textoBoton}</button>
            </div>
        `;

        document.body.appendChild(overlay);

        setTimeout(() => {
            overlay.classList.add('active');
        }, 10);

        const botonCerrar = overlay.querySelector('.btn-modal-close');
        botonCerrar.addEventListener('click', () => {
            overlay.classList.remove('active');
            setTimeout(() => {
                overlay.remove();
            }, 300);
        });
    }
    </script>
</body>
</html>
