<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programación Web - Índice de Ejercicios</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 5px;
            text-align: center;
        }

        p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8f9fa;
            color: #34495e;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
        }

        .btn-link:hover {
            background-color: #3498db;
            color: #ffffff;
            border-color: #3498db;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.2);
        }

        .btn-link span {
            font-size: 12px;
            background-color: #e2e8f0;
            color: #64748b;
            padding: 3px 8px;
            border-radius: 12px;
            transition: all 0.2s ease-in-out;
        }

        .btn-link:hover span {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
    </style>
</head>
