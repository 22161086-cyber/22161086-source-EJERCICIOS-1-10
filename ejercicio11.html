<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Kilómetros a Millas</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --error-color: #ef4444;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .converter-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
        }

        h2 {
            text-align: center;
            color: var(--text-main);
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        input[readonly] {
            background-color: #f9fafb;
            border-color: var(--border-color);
            color: #6b7280;
            cursor: not-allowed;
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .error {
            color: var(--error-color);
            font-size: 13px;
            margin-top: 6px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="converter-card">
        <h2>Conversor de Distancia</h2>
        
        <div class="form-group">
            <label for="kilometros">Distancia en Kilómetros</label>
            <input type="text" id="kilometros" placeholder="Ej. 10">
            <div id="error-msg" class="error"></div>
        </div>

        <div class="form-group">
            <button id="btn-convertir">Convertir</button>
        </div>

        <div class="form-group">
            <label for="millas">Distancia en Millas</label>
            <input type="text" id="millas" readonly placeholder="Resultado de la conversión">
        </div>
    </div>

    <script>
        document.getElementById('btn-convertir').addEventListener('click', function() {
            const inputKilometros = document.getElementById('kilometros');
            const inputMillas = document.getElementById('millas');
            const errorMsg = document.getElementById('error-msg');
            
            const valorIngresado = inputKilometros.value.trim();

            errorMsg.style.display = 'none';
            inputMillas.value = '';

            if (valorIngresado === '') {
                errorMsg.textContent = 'Por favor, ingrese un valor.';
                errorMsg.style.display = 'block';
                return;
            }

            if (isNaN(valorIngresado)) {
                errorMsg.textContent = 'Por favor, ingrese un número válido.';
                errorMsg.style.display = 'block';
                return;
            }

            const kilometros = parseFloat(valorIngresado);
            const factorConversion = 0.621371;
            const millas = kilometros * factorConversion;

            inputMillas.value = millas;
        });
    </script>

</body>
</html>
