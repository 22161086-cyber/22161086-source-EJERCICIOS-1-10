<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 16 - Calculadora JS</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { padding: 8px; width: 200px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; margin-right: 5px; cursor: pointer; border: none; border-radius: 4px; background-color: #007BFF; color: white; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        input[readonly] { background-color: #e9ecef; border: 1px solid #ced4da; }
    </style>
</head>
<body>

    <h2>Ejercicio 16 - Calculadora con Funciones Flecha</h2>

    <div class="form-group">
        <label for="numero1">Número 1:</label>
        <input type="text" id="numero1" placeholder="Ingresa el primer número">
    </div>

    <div class="form-group">
        <label for="numero2">Número 2:</label>
        <input type="text" id="numero2" placeholder="Ingresa el segundo número">
    </div>

    <div class="form-group">
        <button onclick="calcularOperacion('suma')">Suma</button>
        <button onclick="calcularOperacion('resta')">Resta</button>
        <button onclick="calcularOperacion('multiplicacion')">Multiplicación</button>
        <button onclick="calcularOperacion('division')">División</button>
    </div>

    <div class="form-group">
        <label for="resultado">Resultado:</label>
        <input type="text" id="resultado" readonly placeholder="El resultado aparecerá aquí">
    </div>

    <script>
        // 1. Funciones flecha para las operaciones matemáticas básicas
        const sumar = (a, b) => a + b;
        const restar = (a, b) => a - b;
        const multiplicar = (a, b) => a * b;
        const dividir = (a, b) => b !== 0 ? a / b : 'Error: División por cero';

        // 2. Función principal encargada de coordinar el flujo y la validación
        const calcularOperacion = (operacion) => {
            // Obtener los valores de los inputs
            const val1 = document.getElementById('numero1').value.trim();
            const val2 = document.getElementById('numero2').value.trim();
            const inputResultado = document.getElementById('resultado');

            // 3. Validación: Verificar que los campos no estén vacíos y sean números válidos
            if (val1 === "" || val2 === "" || isNaN(val1) || isNaN(val2)) {
                inputResultado.value = "Error: Ingrese números válidos";
                return;
            }

            // Convertir los textos limpios a tipo numérico flotante
            const num1 = parseFloat(val1);
            const num2 = parseFloat(val2);
            let resultado;

            // 4. Coordinación de la operación seleccionada
            switch (operacion) {
                case 'suma':
                    resultado = sumar(num1, num2);
                    break;
                case 'resta':
                    resultado = restar(num1, num2);
                    break;
                case 'multiplicacion':
                    resultado = multiplicar(num1, num2);
                    break;
                case 'division':
                    resultado = dividir(num1, num2);
                    break;
                default:
                    resultado = 'Operación no válida';
            }

            // Mostrar el resultado en el campo de texto de solo lectura
            inputResultado.value = resultado;
        };
    </script>

</body>
</html>
